<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login Administrator - Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>body {
    font-family: "Public Sans", sans-serif
    }
/* Custom checkbox check mark */
input[type=checkbox]:checked {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuD1EkTtgM20xNL1WnfCwgxSfTwNVvvdgmZsEarc_gwTXAcJtuN2XHzoBbKdJEMygYSSDCLEizRRDSc7QGEmRYp1gpNPmXAM220f8ZEd7jL-8xn6yBXFzCD5r7bfzC-z0Pq_vC23L0pCt-cc4jKYWTrOdLKkDnxRjhAF03KvTBwnR7LQzvMBTNqlkqOh7qXn-Km5_nDFFm-mv3v3gCwSgcY_Ty4Dm9GKAVhi1p90E-7NHb7WoqYKe6JnjqYvgLAilVwinXOIzOSABLJp)
    }</style>
</head>
<body class="relative flex h-screen w-full flex-col overflow-hidden bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-50 font-display">
<!-- Background with Blur Effect -->
<div class="absolute inset-0 z-0">
<!-- Abstract background image -->
<div class="absolute inset-0 bg-cover bg-center opacity-40 dark:opacity-20 blur-sm" data-alt="Abstract blue geometric waves background" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAT4XlnQc-70p_DmWpn7ksMGl_WVrJlK1OGrOjBcj7U4VRr_rN7ZV4uPL-Fl4WO77zMbeorpUCB4XcdBd31IMBMDa3645QWtd8rFJf_Hr_mLVCovCR-nDd2YiCzoVThSiS-CmXWx2xDMgNUlEO6RnRD7--Z6NQ0YMJwcRq7wXEGhAqbwBMoaa3aHv1lVb24ZCUztTz3PH5nIT6bzRuDiWaNkZd6PNjuQhmkoFsClm9FBngRKZMTxGBewC3ixGMRM158gP-B4gTs8RMk');">
</div>
<!-- Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/10 to-slate-200/50 dark:from-primary/10 dark:to-slate-900/80"></div>
</div>
<!-- Main Content Container -->
<div class="relative z-10 flex h-full w-full items-center justify-center p-4">
<div class="w-full max-w-[480px] flex flex-col items-center">
<!-- Login Card -->
<div class="w-full rounded-xl bg-white dark:bg-slate-800 shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-700">
<div class="p-8 sm:p-10 flex flex-col gap-6">
<!-- Header Section -->
<div class="flex flex-col items-center gap-2">
<div class="flex items-center justify-center w-14 h-14 rounded-full bg-primary/10 text-primary mb-2">
<span class="material-symbols-outlined text-[32px]">admin_panel_settings</span>
</div>
<h1 class="text-2xl font-bold text-slate-900 dark:text-white text-center">Login Administrator</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm text-center">Sistem Pengaduan Masyarakat</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-5 w-full">
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-slate-900 dark:text-slate-200">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 text-[20px]">mail</span>
<input class="form-input w-full pl-11 pr-4 py-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" placeholder="admin@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-slate-900 dark:text-slate-200">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 text-[20px]">lock</span>
<input class="form-input w-full pl-11 pr-11 py-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" placeholder="••••••••" type="password"/>
<button class="absolute right-3 p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Checkbox -->
<div class="flex items-center">
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-primary focus:ring-primary focus:ring-offset-0 transition-all checked:bg-primary checked:border-primary" type="checkbox"/>
</div>
<span class="text-sm font-normal text-slate-600 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-white transition-colors">Ingat Saya</span>
</label>
</div>
<!-- Submit Button -->
<button class="mt-2 w-full bg-primary hover:bg-blue-600 text-white font-semibold py-3.5 px-6 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2">
<span>Masuk</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
</div>
</div>
<!-- Footer -->
<div class="mt-8 text-center">
<p class="text-sm text-slate-500 dark:text-slate-400 font-medium">
                    Sistem Pengaduan Masyarakat © 2025
                </p>
</div>
</div>
</div>
</body></html>
